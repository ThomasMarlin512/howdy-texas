name: Publish GitHub Pages
on:
  push:
    branches: [main]
    paths: ['dist/**', '.github/workflows/pages.yml', 'package.json', 'tests/**']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Check source
        run: |
          npm test
          npm run check
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static website only
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
